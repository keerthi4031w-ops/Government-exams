name: Update exams
on:
  schedule:
    - cron: "30 1 * * *"   # every day at 7:00 AM IST
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic
      - run: python updater.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit changes
        run: |
          git config user.name "exam-bot"
          git config user.email "exam-bot@users.noreply.github.com"
          git add exams.json
          git diff --cached --quiet || (git commit -m "Update exams" && git push)
